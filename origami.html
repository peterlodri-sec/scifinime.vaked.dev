<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>origami — a short · 𝓼𝓬𝓲𝓕𝓲𝓷𝓲𝓶𝓮</title>
<meta name="description" content="origami — a short: one sheet folds into a paper crane in the browser. score: Rone — Origami · So So So.">
<meta name="theme-color" content="#05131a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://scifinime.vaked.dev/origami.html">
<style>
  :root{
    --bg:#05131a; --ink:#cfe3e0; --dim:#7fa8a2; --faint:#3d6a66;
    --cyan:#4fe3d0; --amber:#e8b05c; --rose:#ff7fa3;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --serif:"Georgia",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;
    background-image:radial-gradient(ellipse at 50% 32%,rgba(79,227,208,.06),transparent 55%),
                     radial-gradient(ellipse at 50% 90%,rgba(232,176,92,.05),transparent 60%);}
  .stage{position:fixed;inset:0;display:grid;place-items:center}
  svg{width:min(92vw,860px);height:auto;overflow:visible}
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px 24px}
  .hud .top{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .hud .top a{color:inherit;text-decoration:none;pointer-events:auto}
  .hud .top a:hover{color:var(--cyan)}
  .hud .bot{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);line-height:2}
  .hud .bot b{color:var(--rose);font-weight:400}
  .hud .bot a{color:var(--cyan);text-decoration:none;pointer-events:auto}
  .hud .bot a:hover{text-decoration:underline}
  /* the fold — 12s loop: sheet → creases draw → crane assembles → breathe → reset */
  .sheet{opacity:0;animation:sheet 12s ease-in-out infinite}
  .crease{stroke:var(--amber);stroke-width:1.4;fill:none;stroke-dasharray:520;stroke-dashoffset:520;
    animation:draw 12s ease-in-out infinite}
  .piece{opacity:0;transform-box:fill-box;transform-origin:center;animation:piece 12s ease-in-out infinite}
  .crane{filter:drop-shadow(0 0 12px rgba(232,176,92,.22))}
  @keyframes sheet{0%,8%{opacity:0;transform:translateY(8px)}18%,72%{opacity:.45;transform:none}82%,100%{opacity:0}}
  @keyframes draw{0%,16%{stroke-dashoffset:520}40%,74%{stroke-dashoffset:0}86%,100%{stroke-dashoffset:520}}
  @keyframes piece{0%,42%{opacity:0;transform:scale(.86)}58%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:scale(1.04)}}
  @media (prefers-reduced-motion: reduce){
    .sheet,.crease,.piece{animation:none}
    .sheet{opacity:.4}.crease{stroke-dashoffset:0}.piece{opacity:1}
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 800 600" role="img" aria-label="origami — a flat sheet with creases drawing across it, folding into a paper crane">
    <g class="sheet">
      <polygon points="280,300 520,300 560,380 240,380" fill="rgba(244,234,214,0.10)" stroke="rgba(244,234,214,0.35)" stroke-width="1.5"/>
    </g>
    <g>
      <line class="crease" x1="280" y1="300" x2="560" y2="380" style="animation-delay:.2s"/>
      <line class="crease" x1="520" y1="300" x2="240" y2="380" style="animation-delay:.5s"/>
      <line class="crease" x1="400" y1="300" x2="400" y2="380" style="animation-delay:.8s"/>
    </g>
    <g class="crane">
      <polygon class="piece" points="400,250 470,330 400,360 330,330" fill="#f4ead6" style="animation-delay:0s"/>
      <polygon class="piece" points="400,250 330,330 248,300 340,238" fill="#fbf5e6" style="animation-delay:.15s"/>
      <polygon class="piece" points="400,250 470,330 552,300 460,238" fill="#efe3c8" style="animation-delay:.3s"/>
      <polygon class="piece" points="400,250 422,200 454,184 430,226" fill="#fffdf7" style="animation-delay:.45s"/>
      <polygon class="piece" points="400,360 380,406 342,416 366,372" fill="#fffdf7" style="animation-delay:.6s"/>
    </g>
  </svg>
</div>
<div class="hud">
  <div class="top"><a href="https://scifinime.vaked.dev">𝓼𝓬𝓲𝓕𝓲𝓷𝓲𝓶𝓮</a> · origami — a short</div>
  <div class="bot">score · <b>Rone — Origami</b> · <b>So So So</b><br>
    one sheet folds into a crane · <a href="https://scifinime.vaked.dev">the door ↗</a></div>
</div>
</body>
</html>
